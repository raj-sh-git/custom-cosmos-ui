{% extends "base.html" %}

{% block title %}Update Password - CosmosUI{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 32px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 14px; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3); margin-bottom: 14px;">
                <i class="fa-solid fa-key" style="font-size: 24px; color: var(--warning);"></i>
            </div>
            <h2 style="font-family: var(--font-heading); font-size: 22px; font-weight: 700; color: var(--text-white); margin-bottom: 6px;">
                Password Update Required
            </h2>
            <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5;">
                Your account requires a password change before you can access the Cosmos UI workspace.
            </p>
        </div>

        <form method="POST" action="{{ url_for('ui.force_password_reset') }}" style="display: flex; flex-direction: column; gap: 16px;" onsubmit="return validateResetForm(event)">
            <div>
                <label class="form-label" style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; display: block;">
                    New Password *
                </label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-lock icon-inside" style="font-size: 13px; top: 12px;"></i>
                    <input type="password" name="new_password" id="resetNewPassword" required autofocus 
                           placeholder="Enter new password (min 6 chars)" style="width: 100%; padding-left: 36px; height: 42px; font-size: 13.5px;">
                </div>
            </div>

            <div>
                <label class="form-label" style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; display: block;">
                    Confirm New Password *
                </label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-lock-open icon-inside" style="font-size: 13px; top: 12px;"></i>
                    <input type="password" name="confirm_password" id="resetConfirmPassword" required 
                           placeholder="Repeat new password" style="width: 100%; padding-left: 36px; height: 42px; font-size: 13.5px;">
                </div>
            </div>

            <div id="resetErrorMsg" style="display: none; padding: 10px 14px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: 6px; color: #fca5a5; font-size: 12.5px;"></div>

            <div style="margin-top: 8px;">
                <button type="submit" class="btn btn-primary" style="width: 100%; height: 44px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fa-solid fa-check"></i>
                    <span>Set New Password & Continue</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function validateResetForm(e) {
    const p1 = document.getElementById('resetNewPassword').value;
    const p2 = document.getElementById('resetConfirmPassword').value;
    const err = document.getElementById('resetErrorMsg');
    
    if (p1.length < 6) {
        e.preventDefault();
        err.style.display = 'block';
        err.innerText = 'Password must be at least 6 characters long.';
        return false;
    }
    if (p1 !== p2) {
        e.preventDefault();
        err.style.display = 'block';
        err.innerText = 'Passwords do not match.';
        return false;
    }
    err.style.display = 'none';
    return true;
}
</script>
{% endblock %}
